[all]
core01 ansible_host=10.0.0.11
core02 ansible_host=10.0.0.12
core03 ansible_host=10.0.0.13
edge01 ansible_host=10.0.1.21
edge02 ansible_host=10.0.1.22
edge03 ansible_host=10.0.1.23

[all:vars]
ansible_connection=ssh
ansible_python_interpreter=/usr/bin/python3
ansible_user=ansiboot
ansible_port=22
ansible_timeout=15
ansible_ssh_retries=2
ansible_ssh_common_args=-o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
ansible_become=false
env=base
tier=core
region=global

[core]
core01
core02
core03

[edge]
edge01
edge02
edge03

[linux]
core01
core02
core03
edge01
edge02
edge03

[physical]
core01
edge01

[virtual]
core02
core03
edge02
edge03
