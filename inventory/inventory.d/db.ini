[db]
db01 ansible_host=10.20.0.11
db02 ansible_host=10.20.0.12
db03 ansible_host=10.20.0.13

[db:vars]
ansible_user=dbops
ansible_port=22
ansible_become=true
role=database
engine=postgresql
replication=enabled
backup=enabled
encrypted_at_rest=true
encrypted_in_transit=true
max_connections=800
shared_buffers=2GB
work_mem=32MB
maintenance_work_mem=256MB
autovacuum=true
env=prod

[primary]
db01

[replica]
db02
db03

[backup_targets]
db02
db03

[stateful]
db01
db02
db03

[restricted]
db01
db02
db03
