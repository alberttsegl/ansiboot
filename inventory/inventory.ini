[all]
localhost ansible_connection=local

[ungrouped]

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
ansible_become=false
ansible_timeout=10
ansible_ssh_retries=2

[web]
web01 ansible_host=192.168.10.11
web02 ansible_host=192.168.10.12

[db]
db01 ansible_host=192.168.20.21
db02 ansible_host=192.168.20.22

[web:vars]
ansible_user=deploy
ansible_port=22

[db:vars]
ansible_user=dbadmin
ansible_port=22

[prod:children]
web
db

[prod:vars]
env=production
