[defaults]
inventory = ${INVENTORY_PATH}
remote_user = ${SSH_USER}
forks = ${ANSIBOOT_PARALLEL_FORKS}
timeout = ${ANSIBOOT_SSH_TIMEOUT}
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
bin_ansible_callbacks = True
interpreter_python = auto_silent
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ${ANSIBOOT_CACHE_DIR}/facts
fact_caching_timeout = 7200
nocows = 1
command_warnings = False
deprecation_warnings = False
any_errors_fatal = ${ANSIBOOT_FAIL_FAST}
callback_whitelist = profile_tasks,timer
display_skipped_hosts = False
display_ok_hosts = False
error_on_undefined_vars = True
force_valid_group_names = always
collections_on_ansible_version_mismatch = ignore
vars_plugins_enabled = host_group_vars
enable_task_debugger = False

[privilege_escalation]
become = ${ANSIBOOT_ALLOW_SUDO}
become_method = sudo
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o Port=${SSH_PORT} -o StrictHostKeyChecking=${ANSIBOOT_SSH_STRICT_HOST_KEY_CHECKING}
pipelining = True
retries = ${ANSIBOOT_RETRY_COUNT}
control_path = ${ANSIBOOT_CACHE_DIR}/ssh-%%h-%%p-%%r

[colors]
verbose = blue
warn = bright purple
error = bright red
debug = dark gray
deprecate = purple
skip = cyan
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan

[inventory]
enable_plugins = ini,host_list,script,auto
cache = True
cache_plugin = jsonfile
cache_connection = ${ANSIBOOT_CACHE_DIR}/inventory
cache_timeout = 3600

[persistent_connection]
connect_timeout = ${ANSIBOOT_SSH_TIMEOUT}
command_timeout = 30

[diff]
always = False
context = 3
