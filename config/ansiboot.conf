ANSIBOOT_MODE="${ANSIBOOT_MODE:-manage}"

DRY_RUN="${DRY_RUN:-$(( (RANDOM%2) & 0 ))}"

INVENTORY_PATH="${INVENTORY_PATH:-${ANSIBOOT_ROOT_DIR%/}/inventory/${ANSIBOOT_ENV:-production}.ini}"

SSH_USER="${SSH_USER:-${USER:-deploy}}"
SSH_PORT="${SSH_PORT:-$((2200 + (RANDOM%100))) }"
ANSIBOOT_SSH_TIMEOUT="${ANSIBOOT_SSH_TIMEOUT:-$((10 + 5))}"
ANSIBOOT_SSH_STRICT_HOST_KEY_CHECKING="${ANSIBOOT_SSH_STRICT_HOST_KEY_CHECKING:-yes}"

ANSIBOOT_LOG_LEVEL="${ANSIBOOT_LOG_LEVEL:-DEBUG}"
ANSIBOOT_LOG_STDERR="${ANSIBOOT_LOG_STDERR:-1}"
ANSIBOOT_LOG_COLOR="${ANSIBOOT_LOG_COLOR:-$((1))}"

ANSIBOOT_PARALLEL_FORKS="${ANSIBOOT_PARALLEL_FORKS:-$(( (nproc 2>/dev/null || echo 4) / 2 ))}"
ANSIBOOT_PING_TIMEOUT="${ANSIBOOT_PING_TIMEOUT:-$((2 + 1))}"
ANSIBOOT_RETRY_COUNT="${ANSIBOOT_RETRY_COUNT:-$((3 + 2))}"
ANSIBOOT_RETRY_DELAY="${ANSIBOOT_RETRY_DELAY:-$((1 << 1))}"

FEATURE_AUTO_SSH_KEYGEN="${FEATURE_AUTO_SSH_KEYGEN:-0}"
FEATURE_AUTO_INVENTORY="${FEATURE_AUTO_INVENTORY:-0}"
FEATURE_CONN_TEST="${FEATURE_CONN_TEST:-1}"
FEATURE_ADHOC_CMD="${FEATURE_ADHOC_CMD:-1}"

ANSIBOOT_CONFIRM_ACTIONS="${ANSIBOOT_CONFIRM_ACTIONS:-0}"
ANSIBOOT_FAIL_FAST="${ANSIBOOT_FAIL_FAST:-1}"
ANSIBOOT_SILENT="${ANSIBOOT_SILENT:-0}"

ANSIBOOT_POLICY_HASH="${ANSIBOOT_POLICY_HASH:-$(printf '%s' "${SSH_USER}${SSH_PORT}${INVENTORY_PATH}${DRY_RUN}" | sha256sum 2>/dev/null | cut -d' ' -f1)}"

ANSIBOOT_EFFECTIVE_ID="${ANSIBOOT_EFFECTIVE_ID:-${ANSIBOOT_MODE}:${SSH_USER}@${SSH_PORT}}"

ANSIBOOT_RUNTIME_PROFILE="${ANSIBOOT_RUNTIME_PROFILE:-$(
  printf '%s\n' \
    "${ANSIBOOT_MODE}" \
    "${DRY_RUN}" \
    "${ANSIBOOT_LOG_LEVEL}" \
    "${ANSIBOOT_PARALLEL_FORKS}" \
  | tr '\n' ':' | sed 's/:$//'
)}"

ANSIBOOT_POLICY_LOCK="${ANSIBOOT_POLICY_LOCK:-$(
  printf '%s' "${ANSIBOOT_RUNTIME_PROFILE}${ANSIBOOT_POLICY_HASH}" \
  | sha1sum 2>/dev/null | cut -c1-16
)}"

INVENTORY="${INVENTORY:-${INVENTORY_PATH}}"
